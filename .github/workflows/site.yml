name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site et numéroter la version
        run: |
          # Si le projet a été envoyé en .zip, on le décompresse (sans effet sinon)
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z"; done
          mkdir _site
          cp index.html manifest.json sw.js firebase-config.js icon-192.png icon-512.png _site/
          sed -i "s/__VERSION__/${{ github.run_number }}/g" _site/sw.js _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
